services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: split
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d split"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - splituz_db:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://split:split@db:5432/split
      DATASET_DIR: /app/dataset
      RESULT_DIR: /app/natija
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/app/dataset:ro
      - ./natija:/app/natija

volumes:
  splituz_db:
